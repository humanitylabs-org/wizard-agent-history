[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wizard-agent-history"
version = "0.1.0"
description = "Verified monthly agent history and copy-only Hermes trimming"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
agent-history = "agent_history.__main__:main"

[tool.setuptools.packages.find]
include = ["agent_history*"]
